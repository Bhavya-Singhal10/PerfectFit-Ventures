<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="100%" height="100%" role="img" aria-labelledby="pfv-logo-title" shape-rendering="geometricPrecision">
  <title id="pfv-logo-title">PerfectFit Ventures — Your Fit. Every Brand.</title>
  <defs>
    <!-- Hanger Hook & Roof Gradient (Deep Midnight Navy to Electric Cyan) -->
    <linearGradient id="hangerGrad" x1="260" y1="60" x2="540" y2="190" gradientUnits="userSpaceOnUse">
